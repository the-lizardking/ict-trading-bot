decision_requests:
- id: DEC-20260910-EXIT-EVAL-60S-REMEDY
  question: The exit-eval 60s promise is breached on 6.2% of restarts (20 of 325 post-fix, max 210.4s)
    and on 14 within-process intervals in 18 days. Both causes are now named. Two exact Tier-2 remedies
    are ready, independent of each other, each with a one-env-flip rollback. Which, if any, should be
    armed - and is the restart boundary in scope for the 60s promise at all?
  urgency: routine
  asked_on: '2026-09-10'
  context: 'MEASURED 2026-09-10T06:13Z from GET /api/bot/exit-interval/soak (whole-file summary + breached_only=true&limit=2000,
    both COMPLETE censuses: 1218 of 1218 breach rows, 444 of 444 measured boundaries), plus four /api/diag/journalctl
    restart windows and a 1000-row /api/diag/log_file tail. RESTART GAP: min 17.5s, median 40.5s, p90
    56.0s, p95 60.9s post-fix; it decomposes as residual cadence sleep 0-30s + systemd downtime ~0.3s
    + startup-to-thread 6-15s + cold first pass 12.7-16.9s, reconciling exactly on all four measured boundaries
    - i.e. 19-60s BY CONSTRUCTION against a 60s requirement, with essentially no headroom, at 18.1 restarts/day.
    Total exposure 756 s/day (12.6 min/day, 0.875% of wall clock) in which no open position''s exit is
    evaluated - and 93.8% of that is from COMPLIANT restarts, so the breach rate understates it. WITHIN-PROCESS:
    97.0% of the 1218 predate 2026-08-22; the live residual is 14 breaches in 18 days, 10 of them in the
    04:00-05:00Z IBKR reset window, where each IB-routed package pays a serialized 29.0s pinned-thread
    queue timeout so a pass costs n_IB_packages x 29s and crosses 60s at THREE packages.'
  options:
  - key: r2_only
    label: Arm R2 only - the per-pass IB circuit breaker
    implication: 'The larger effect on the larger live residual. Once one IB fetch returns a pinned-thread
      queue timeout, skip the remaining IB packages in THAT pass. Changes NOTHING about what any package
      receives - a skipped package gets the same candles=None it would have got 29s later - it bounds
      the cost of an outcome already determined. Pass cost in the reset window falls from n x 29s to ~35s.
      Rollback EXIT_LOOP_IB_BREAKER_DISABLED. Cost: during a transient (non-outage) queue timeout, later
      IB packages are skipped for one pass and retried 30s later.'
  - key: both
    label: Arm R2 and R1
    implication: 'R1 additionally moves _start_exit_loop above _apply_per_account_leverage in src/main.py::main()
      - measured 2.0-10.0s off the startup term, median ~3s, and it is the 10s tail it targets. Must stay
      AFTER boot_reconcile so a pass cannot evaluate a journal row the reconciler is about to void. Rollback
      EXIT_LOOP_EARLY_START_DISABLED. Cost: the cold first pass then overlaps the leverage pre-flight
      on a 2-core box.'
  - key: r1_only
    label: Arm R1 only
    implication: Touches only startup ordering and no fetch behaviour - the smaller blast radius of the
      two - but it addresses the persistent 6.2% restart-gap tail and leaves the reset-window residual
      entirely.
  - key: decide_the_scope_instead
    label: Record a DECIDED on whether the restart boundary is in scope, and arm nothing
    implication: A legitimate answer. The restart gap is 19-60s by construction, so keeping the 60s promise
      across a restart means changing one of the four measured terms - there is no version of the current
      design that comfortably clears it. If the boundary is declared out of scope, that must be RECORDED
      with its consequence stated (756 s/day unevaluated), never left looking like a fix about to happen.
