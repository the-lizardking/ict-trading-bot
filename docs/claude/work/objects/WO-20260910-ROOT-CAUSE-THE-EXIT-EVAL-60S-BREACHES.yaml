corrections_this_object_makes:
- THE TWO BREACH POPULATIONS DO NOT SHARE A CAUSE. The dispatch brief flagged the 10x ratio as a hint
  they might differ; they do, and forcing one story would have produced a wrong remedy for whichever half
  it did not fit.
- '"1216 lifetime, did not cease" is true of the COUNT and misleading about the RATE. 1182 of 1218 predate
  2026-08-22; the post-fix rate is of order 0.03% against a lifetime 1.795%, roughly 60x lower. The lifetime
  figure is a pooled rate over a bimodal population and must not be quoted as current.'
- OI-20260910-...'s expectation of `within` on 11 gaps of 25.3-53.9s is CONTRADICTED by the complete 444-boundary
  read (17.3% lifetime / 6.2% post-fix). That was an under-powered one-day sample of a distribution whose
  94th percentile IS the requirement, not an instrument fault. The row's expectation is corrected; the
  instrument is working.
- DEPLOY SPEED IS NOT THE CAUSE AND MUST NOT BE PROPOSED AS THE FIX. Measured systemd downtime is ~0.3s
  on all four boundaries - the process exits cleanly on SIGTERM. The dominant variable term is the un-slept
  remainder of the loop's OWN 30s cadence, which even a zero-downtime deploy would not remove.
- BL-20260816-IB-QUEUE-TIMEOUT-EXCEEDS-EXIT-BUDGET is marked `resolved` with no resolved_at and no recorded
  resolution while its mechanism is still firing, and its criterion 1 ("COUNT IT FIRST - how OFTEN it
  fires is UNMEASURED") is what this work supplies. Re-opened as a RECURRENCE rather than minting a fourth
  id.
not_established:
